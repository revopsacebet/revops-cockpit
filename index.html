<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<!-- App já é dark nativo: trava o Dark Reader (e similares) p/ não "clarear" fundos escuros (ex.: caixa do tooltip) -->
<meta name="darkreader-lock">
<title>RevOps Cockpit — Apostou</title>
<!-- Aquece a conexão com o endpoint de dados (Apps Script → googleusercontent) p/ o 1º fetch conectar antes. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- SheetJS: carregado SOB DEMANDA no export (ensureXLSX_), não em todo load — tira ~1MB do carregamento. -->

<style>
  :root {
    --bg: #000000;
    --surface: #0c0c0c;
    --surface-2: #141414;
    --border: #1f1f1f;
    --border-strong: #2a2a2a;
    --text: #f5f5f5;
    --text-muted: #888888;
    --text-dim: #555555;
    --positive: #4ade80;
    --warning: #fbbf24;
    --negative: #f87171;
    --accent: #60a5fa;
    --accent-yellow: #facc15;
    --accent-orange: #f97316;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; border-bottom: 1px solid var(--border);
    /* z acima do .slicer (z-11): o popover de export (Excel) é filho da topbar e cai
       sobre a linha do slicer — sem isso o slicer inteiro pinta por cima do popover. */
    position: sticky; top: 0; z-index: 12; background: var(--bg);
    flex-wrap: wrap; gap: 12px;
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: var(--text-muted); font-weight: 400; }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta-chip {
    font-size: 11px; color: var(--text-muted);
    background: var(--surface-2); padding: 6px 12px;
    border-radius: 6px; border: 1px solid var(--border);
  }
  .meta-chip strong { color: var(--text); font-weight: 600; }
  .mock-chip {
    font-size: 11px; color: var(--warning);
    background: rgba(251, 191, 36, .08); padding: 6px 12px;
    border-radius: 6px; border: 1px solid rgba(251, 191, 36, .3);
  }
  .user-chip {
    font-size: 11px; color: var(--text); background: var(--surface-2);
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-strong);
  }
  .logout-btn {
    font-size: 11px; color: var(--text-muted); background: transparent;
    padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);
    cursor: pointer; font-family: inherit;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--border-strong); }
  /* Tela de login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card {
    width: 320px; max-width: 100%; display: flex; flex-direction: column; gap: 12px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 32px 28px;
  }
  .login-title { font-size: 20px; font-weight: 700; color: var(--text); }
  .login-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .login-card input {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 11px 12px; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .login-card input:focus { outline: none; border-color: var(--border-strong); }
  .login-card button {
    margin-top: 4px; padding: 11px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--text); color: var(--bg, #000); font-weight: 600; font-size: 14px; font-family: inherit;
  }
  .login-card button:disabled { opacity: .5; cursor: default; }
  .login-err { font-size: 12px; color: var(--negative); }
  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-muted); font-family: inherit;
    background: var(--surface-2); padding: 6px 12px;
    border-radius: 6px; border: 1px solid var(--border);
    cursor: pointer; transition: all .15s;
  }
  .refresh-btn:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
  .refresh-btn:disabled { opacity: .55; cursor: not-allowed; }
  .refresh-btn svg { width: 13px; height: 13px; }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* DATE SLICER ROW */
  .slicer {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 32px; border-bottom: 1px solid var(--border);
    background: var(--bg); flex-wrap: wrap;
    /* acima da .tabs (z-9): senão o painel do multiselect de CANAL, preso no stacking
       context da .slicer, fica coberto pela barra de abas. Abaixo da .topbar (z-12) de
       propósito, p/ o popover de export (filho da topbar) cair sobre o slicer. */
    position: sticky; top: 65px; z-index: 11;
  }
  .slicer-group { display: flex; align-items: center; gap: 8px; }
  .slicer label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
  }
  /* Secondary (tab-level) slicers default to ORANGE; the global top bar (.slicer-main) is overridden back to yellow below. */
  .slicer input[type="date"] {
    background: rgba(249, 115, 22, .07); border: 1px solid rgba(249, 115, 22, .5);
    color: var(--text); font-family: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 6px; outline: none;
    color-scheme: dark;
  }
  .slicer input[type="date"]:focus { border-color: var(--accent-orange); }
  .slicer select {
    background: var(--surface); border: 1px solid rgba(249, 115, 22, .5);
    color: var(--text); font-family: inherit; font-size: 12px;
    padding: 6px 10px; border-radius: 6px; outline: none;
    cursor: pointer; color-scheme: dark; max-width: 220px;
  }
  .slicer select:focus { border-color: var(--accent-orange); }
  /* opções do dropdown nativo: força fundo escuro + texto claro (o bg amarelo
     do select vazava pro popup e deixava as opções ilegíveis) */
  .slicer select option { background: var(--surface); color: var(--text); }
  /* GLOBAL top slicer keeps the yellow accent (MTD/diário/7d/30d, Canal, Growth/Total Casa) */
  .slicer-main input[type="date"] { background: rgba(250, 204, 21, .06); border-color: rgba(250, 204, 21, .45); }
  .slicer-main input[type="date"]:focus { border-color: var(--accent-yellow); }
  .slicer-main select { border-color: rgba(250, 204, 21, .45); }
  .slicer-main select:focus { border-color: var(--accent-yellow); }
  .slicer-divider { width: 1px; height: 24px; background: var(--border); }
  /* Régua compacta (aba Benchmark Lottu): encosta o rótulo nos botões de preset p/ os 6 grupos — incluindo
     o Período — caberem numa LINHA SÓ até ~1400px de viewport. Não mexe no espaço ENTRE grupos. */
  .slicer-tight .slicer-presets { margin-left: 0; }
  .slicer-arrow { color: var(--text-dim); font-size: 12px; }
  .slicer-presets { display: flex; gap: 4px; margin-left: 6px; }
  .preset-btn {
    background: rgba(249, 115, 22, .07); border: 1px solid rgba(249, 115, 22, .5);
    color: var(--text-muted); padding: 6px 12px; font-size: 11px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    transition: all .15s;
  }
  .preset-btn:hover { color: var(--text); border-color: rgba(249, 115, 22, .7); }
  .preset-btn.active { background: var(--accent-orange); color: #000; border-color: var(--accent-orange); font-weight: 600; }
  /* GLOBAL top slicer presets stay yellow */
  .slicer-main .preset-btn { background: rgba(250, 204, 21, .06); border-color: rgba(250, 204, 21, .45); }
  .slicer-main .preset-btn:hover { border-color: rgba(250, 204, 21, .5); }
  .slicer-main .preset-btn.active { background: var(--accent-yellow); border-color: var(--accent-yellow); }
  .apply-btn {
    background: var(--accent-yellow); border: none; color: #000;
    padding: 7px 16px; font-size: 12px; font-weight: 600;
    border-radius: 6px; cursor: pointer; font-family: inherit;
    margin-left: auto;
  }
  .apply-btn:disabled { opacity: .4; cursor: not-allowed; }
  .apply-btn:hover:not(:disabled) { opacity: .9; }
  .tabs {
    display: flex; gap: 2px; padding: 0 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg); overflow-x: auto;
    position: sticky; top: 126px; z-index: 9;
  }
  .tab-btn {
    background: transparent; border: none; color: var(--text-muted);
    padding: 14px 18px; font-size: 13px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    font-family: inherit; white-space: nowrap;
    transition: color .15s, border-color .15s;
  }
  .tab-btn:hover { color: var(--accent-yellow); }
  .tab-btn.active { color: var(--accent-yellow); border-bottom-color: var(--accent-yellow); }
  main {
    padding: 40px 32px 60px;
    max-width: 1600px; margin: 0 auto;
    position: relative;             /* âncora do .gate-overlay */
  }
  /* Portão de dado oficial: enquanto o payload não chega (ou falhou), o conteúdo fica borrado e
     inerte, com uma engrenagem no meio. Evita que alguém leia o MOCK — ou o número do período
     anterior — como se fosse o dado real. Ver `aguardando` no app.jsx. */
  .gate-blur {
    filter: blur(6px) saturate(.6);
    pointer-events: none; user-select: none;
    transition: filter .18s ease;
  }
  .gate-overlay {
    position: fixed; inset: 0; z-index: 60;   /* fixed: fica no meio da TELA, não do <main>, que é
                                                 alto demais e jogaria a engrenagem lá pra baixo */
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: rgba(8,8,8,.35);
    pointer-events: none;                     /* só o botão de retry recebe clique */
  }
  /* .apply-btn tem `margin-left: auto` (no slicer ele é empurrado para a direita) — dentro do
     overlay isso jogava o botão para o canto em vez de centralizar. */
  .gate-overlay .apply-btn { pointer-events: auto; margin: 6px auto 0; align-self: center; }
  .gate-gear { width: 54px; height: 54px; color: var(--accent-orange); opacity: .95; }
  .gate-gear.spin { animation: gate-spin 2.4s linear infinite; transform-origin: 50% 50%; }
  @keyframes gate-spin { to { transform: rotate(360deg); } }
  .gate-msg { font-size: 14px; font-weight: 600; color: #e8e8e8; letter-spacing: .2px; }
  .gate-msg.gate-err { color: var(--accent-yellow); }
  .gate-sub { font-size: 12px; color: var(--text-muted); }
  @media (prefers-reduced-motion: reduce) { .gate-gear.spin { animation-duration: 6s; } }
  .tab-header {
    margin-bottom: 32px; display: flex;
    align-items: baseline; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  .tab-header h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
  }
  .tab-header .subtitle {
    color: var(--text-muted); font-size: 13px; margin-top: 6px;
  }
  /* Régua de filtros da seção "Retenções por faixa de FTD": congela abaixo da
     barra de abas (top:126 + ~46 de altura das abas) ao rolar a seção. */
  .slicer-ruler {
    position: sticky; top: 174px; z-index: 8;
    background: var(--bg); flex-wrap: wrap;
    margin: 0 -32px 28px; padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .7);
  }
  /* HERO KPI GRID — 3 grandes cards */
  .hero-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-bottom: 36px;
  }
  .hero {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 26px;
    position: relative;
    transition: border-color .15s, transform .15s;
  }
  .hero:hover { border-color: var(--border-strong); }
  .hero .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .hero .label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .07em;
    font-weight: 600;
  }
  .hero .farol-dot {
    width: 15px; height: 15px; border-radius: 50%;
    box-shadow: 0 0 14px currentColor;
  }
  .hero .farol-dot.verde { background: var(--positive); color: var(--positive); }
  .hero .farol-dot.amarelo { background: var(--warning); color: var(--warning); }
  .hero .farol-dot.vermelho { background: var(--negative); color: var(--negative); }
  .hero .farol-dot.cinza { background: var(--text-dim); color: transparent; box-shadow: none; }
  .hero .value {
    font-size: 38px; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1.05; margin-bottom: 18px;
  }
  /* Progress bar vs BP */
  .vs-bp { margin-top: 4px; }
  .vs-bp-head {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; font-size: 11px; color: var(--text-muted);
  }
  .vs-bp-head .bp-label { color: var(--text-dim); }
  .vs-bp-head .bp-val { color: var(--text); font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .vs-bp-head .pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  .vs-bp-head .pct.verde { color: var(--positive); }
  .vs-bp-head .pct.amarelo { color: var(--warning); }
  .vs-bp-head .pct.vermelho { color: var(--negative); }
  .vs-bp-track {
    height: 4px; background: var(--surface-2);
    border-radius: 2px; overflow: hidden; position: relative;
  }
  .vs-bp-fill {
    height: 100%; border-radius: 2px;
    transition: width .4s ease;
  }
  .vs-bp-fill.verde { background: var(--positive); }
  .vs-bp-fill.amarelo { background: var(--warning); }
  .vs-bp-fill.vermelho { background: var(--negative); }
  .vs-bp-fill.cinza { background: var(--text-dim); }
  .vs-bp-mark {
    position: absolute; top: -2px; bottom: -2px;
    width: 1px; background: var(--text-muted); opacity: .5;
  }
  .delta-m1 {
    margin-top: 12px; font-size: 11px; color: var(--text-muted);
  }
  /* Posição do M-1 (mesmo período do mês anterior) — NÃO é variação, então sem seta/cor de tendência */
  .delta-m1 .m1-val { color: var(--text-dim); font-weight: 600; }
  /* Linha de REFERÊNCIA: a métrica do card sobre outra base (FreeSpins/GGR, Bonificação/GGR). Deliberadamente
     mais apagada que o M-1 — é contexto de margem, não a métrica do card, e não tem meta nem farol. */
  .hero .hf-ref { margin-top: 4px; font-size: 11px; color: var(--text-muted); }
  .hero .hf-ref .ref-val { color: var(--text-dim); font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Trend = projeção de fechamento do mês (MTD × dias-do-mês/decorridos) */
  .trend-line {
    margin-top: 10px; display: flex; align-items: baseline; gap: 8px;
    font-size: 11px; color: var(--text-muted);
    padding-top: 8px; border-top: 1px dashed var(--border);
  }
  .trend-line .trend-tag { color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .trend-line .trend-val { color: var(--text); font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .trend-line .trend-pct { font-weight: 600; font-variant-numeric: tabular-nums; margin-left: auto; }
  .trend-line .trend-pct.verde { color: var(--positive); }
  .trend-line .trend-pct.amarelo { color: var(--warning); }
  .trend-line .trend-pct.vermelho { color: var(--negative); }
  .trend-line .trend-pct.cinza { color: var(--text-dim); }
  /* Farol — variante do hero card: valor à esquerda, BP/Trend/M-1 à direita, sparkline das 4 semanas na base */
  .hero-farol .hf-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hero-farol .value { font-size: 34px; margin-bottom: 0; }
  .hero-farol .hf-stats { text-align: right; font-size: 11px; color: var(--text-muted); display: flex; flex-direction: column; gap: 5px; padding-top: 3px; white-space: nowrap; }
  .hero-farol .hf-stats .bp-label { color: var(--text-dim); }
  .hero-farol .hf-stats .bp-val { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-farol .hf-stats .pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero-farol .hf-stats .pct.verde { color: var(--positive); }
  .hero-farol .hf-stats .pct.amarelo { color: var(--warning); }
  .hero-farol .hf-stats .pct.vermelho { color: var(--negative); }
  .hero-farol .hf-stats .pct.cinza { color: var(--text-dim); }
  .hero-farol .hf-share { color: var(--text-dim); }
  .hero-farol .hf-share .share-val { color: var(--accent-yellow); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-farol .hf-trend .trend-tag { color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .hero-farol .hf-trend .trend-val { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero-farol .hf-m1 .m1-val { color: var(--text-dim); font-weight: 600; }
  /* No card do Farol a referência entra na coluna da direita (hf-stats já dá o gap) — sem margin própria. */
  .hero-farol .hf-ref { margin-top: 0; color: var(--text-muted); }
  /* Sparkline — linha neutra (branca) das 4 semanas fechadas + 1 ponto por semana + seta de direção branca na base.
     Cada ponto leva o VALOR da semana num rótulo acima da bolinha (HTML absoluto: o SVG é preserveAspectRatio=none
     e esticaria o texto). O `top` do rótulo vem do y do ponto em px — logo .spark-svg tem que ter a MESMA altura
     do viewBox (58, setado inline pelo componente); se mudar o H lá, o rótulo acompanha sozinho. */
  .spark { position: relative; margin-top: 14px; padding-top: 12px; padding-bottom: 6px; border-top: 1px dashed var(--border); }
  .spark-plot { position: relative; width: 100%; }
  .spark-svg { width: 100%; height: 100%; display: block; }
  .spark-line { stroke: #e8e8e8; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .spark-dot { fill: #f5f5f5; }
  .spark-lbl {
    position: absolute; transform: translate(-50%, -100%); margin-top: -7px;
    font-size: 10.5px; font-weight: 700; line-height: 1; white-space: nowrap;
    color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.01em; pointer-events: auto;
  }
  .spark-lbl.start { transform: translate(-3px, -100%); }
  .spark-lbl.end { transform: translate(calc(-100% + 3px), -100%); }
  /* intervalo coberto pelas bolinhas — mesma linha da seta, lado esquerdo (sempre livre) */
  .spark-range { position: absolute; left: 0; bottom: -6px; font-size: 9.5px; line-height: 1; color: var(--text-dim); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
  .spark-arrow { position: absolute; right: 0; bottom: -8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; color: var(--text); font-weight: 500; line-height: 1; letter-spacing: -2px; }
  /* Channel table */
  .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* Tabelas diárias longas (Safras, Ret.Faixa): scroll vertical próprio + cabeçalho/rodapé fixos.
     A moldura (borda/raio) vai pro wrapper porque .ch-table tem overflow:hidden, que quebraria o sticky. */
  .table-scroll.tall {
    max-height: 620px; overflow: auto;
    border: 1px solid var(--border); border-radius: 10px;
    scrollbar-gutter: stable;   /* reserva a calha da scrollbar — não deixa a barra sobrepor o header */
  }
  .table-scroll.tall .ch-table { border: none; border-radius: 0; overflow: visible; }
  .table-scroll.tall thead th { position: sticky; top: 0; z-index: 2; }
  /* tfoot NÃO é sticky (o sticky-bottom glitchava e o Total colava no header). Total rola no fim. */
  .ch-table {
    width: 100%; border-collapse: collapse;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
  }
  .ch-table th, .ch-table td {
    padding: 11px 16px; text-align: right;
    font-size: 12px; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ch-table th:first-child, .ch-table td:first-child {
    text-align: left; min-width: 90px;
  }
  .ch-table thead th {
    background: var(--surface-2); color: var(--text-muted);
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    font-weight: 600;
  }
  .ch-table tbody tr:hover { background: rgba(255,255,255,.02); }
  .ch-table tbody tr:last-child td { border-bottom: none; }
  .ch-table tfoot td {
    background: var(--surface-2); font-weight: 700;
    color: var(--text); border-top: 1px solid var(--border-strong);
  }
  .ch-name { color: var(--text); font-weight: 600; }
  .ch-roas-pos { color: var(--positive); font-weight: 600; }
  .ch-roas-neg { color: var(--negative); font-weight: 600; }
  /* Faixas do farol (rodapé) aplicadas às células vs BP: ≥95% verde · 85–94% amarelo · <85% vermelho */
  .ch-band-verde { color: var(--positive); font-weight: 600; }
  .ch-band-amarelo { color: var(--warning); font-weight: 600; }
  .ch-band-vermelho { color: var(--negative); font-weight: 600; }
  /* Pirâmide de Coorte — rampa BRANCO → VERDE (pedido do Luis 14/08): quanto mais VERDE, melhor;
     quanto mais BRANCO, pior. O que varia de ponta a ponta é a SATURAÇÃO do verde: o passo pior é
     branco (verde zero) e o melhor é verde cheio. Duas tentativas anteriores erraram por variar só
     luminosidade DENTRO do verde (escuro→claro e depois claro→escuro): as duas são escalas legítimas
     de magnitude, mas nenhuma se lê como "bom vs ruim" — é preciso consultar a legenda pra saber
     que ponta é qual. Com branco numa ponta não precisa: a cor é a mensagem.
     A tinta é PRETA nos 6 passos — todos os passos são claros o bastante (contraste medido ≥ 7:1 em
     todos, incluindo o verde mais cheio). Por isso --pirI* virou constante; mantive as 6 variáveis
     pra não ter que mexer no JS se a rampa escurecer de novo. */
  :root {
    --pir1: #f5f5f5; --pir2: #d7f5e1; --pir3: #a6ebbe; --pir4: #6bdb93; --pir5: #38c86f; --pir6: #10b34e;
    --pirI1: #0b0b0b; --pirI2: #0b0b0b; --pirI3: #0b0b0b; --pirI4: #0b0b0b; --pirI5: #0b0b0b; --pirI6: #0b0b0b;
    --pir-open: #f87171;
  }
  .pir-table th, .pir-table td { padding: 3px 6px; font-size: 11.5px; }
  .pir-table thead th { padding: 8px 6px; vertical-align: bottom; line-height: 1.35; }
  .pir-table tbody td:first-child, .pir-table tfoot td:first-child { padding-left: 12px; }
  /* Fronteira entre BLOCOS de métrica (contexto da safra | multiplicadores | retenção sobre D0).
     Não é a mesma coisa que a divisão entre duas colunas do mesmo bloco, então não pode ser só mais um
     fio de 1px: leva uma calha de ar de verdade + fio mais forte. Sem isso as colunas de ret % encostam
     nas de multiplicador e a tabela é lida como uma escada só, com "2,47x" e "28,6%" na mesma sequência. */
  .pir-table th.pir-sep, .pir-table td.pir-sep {
    border-left: 2px solid var(--border-strong);
    padding-left: 22px;
  }
  /* a calha também do lado de fora do fio: empurra a última coluna do bloco anterior.
     Classe explícita em vez de `:has(+ .pir-sep)` — isto é estrutura, não enfeite, e não deve depender
     de suporte a seletor. */
  .pir-table th.pir-sep-end, .pir-table td.pir-sep-end { padding-right: 16px; }
  .pir-meta-tag { display: block; font-weight: 400; text-transform: none; letter-spacing: 0;
                  color: var(--accent-yellow); font-size: 9px; opacity: .85; }
  /* Meta CASCATEADA/PONDERADA (canal sem curva no estudo, ou 2+ canais): marcada com † — uma meta
     derivada de premissa não pode ficar visualmente idêntica a uma declarada, é assim que premissa vira
     "fato".
     ⚠️ NÃO declarar `display` em nada com `.pir-meta-deriv`. A regra base é `display:block` e é ela que
     joga a meta pra LINHA DE BAIXO do cabeçalho; um `inline-block` aqui colava a meta no rótulo da coluna
     e estourava a largura do header (quebrou na tela do Luis em 16/08).
     ⚠️ 2026-08-16 (2ª correção, mesma linha do header): o realce era `text-decoration: underline dashed`
     no TAG INTEIRO. Com 2+ canais TODA coluna é derivada, então o tracejado aparecia embaixo de todos os
     números de uma vez, cruzando os descendentes de um texto de 9px — o Luis não conseguia ler a meta.
     Agora o sublinhado é só no MARCADOR †: em multi-seleção o ruído sai da linha dos números e a
     informação ("esta régua é derivada") continua, reforçada pela legenda e pelo tooltip. */
  .pir-meta-tag .pir-deriv-mk { font-style: normal; text-decoration: underline dotted;
                                text-underline-offset: 2px; }
  /* a célula é um bloco preenchido: a cor tem que encostar nas vizinhas pra escada ser legível de longe */
  /* flex (era block) pra caber a bolinha de comparação à ESQUERDA sem tirar o número da direita:
     o `margin-right:auto` da bolinha empurra o valor pro canto, então colunas com e sem bolinha
     continuam com os números alinhados na mesma régua. */
  .pir-v { display: flex; align-items: center; justify-content: flex-end; gap: 5px;
           padding: 5px 6px; border-radius: 4px; font-weight: 600;
           font-variant-numeric: tabular-nums; }
  /* bolinha vs o mesmo período do mês anterior. O anel colorido diz a direção e o `currentColor` (a
     tinta da própria célula, que já tem contraste garantido contra o passo da rampa) faz o contorno —
     sem ele o anel verde some em cima dos passos mais verdes da escala. */
  /* ⚠️ bolinha CHEIA e sempre na mesma intensidade (pedido do Luis 14/08). Antes era um anel fino de
     2px e a versão de célula aberta vinha com opacity .55 — sobre os passos claros da rampa virava um
     fiapo cinza. Agora é disco sólido, cor fixa, com halo escuro pra não sumir no verde vivo do topo
     da escala. O "esta célula ainda não fechou" continua dito pela hachura da própria célula e pelo
     tooltip; não precisa (nem deve) sair na cor do sinal. */
  .pir-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-right: auto;
             box-shadow: 0 0 0 1.5px rgba(11,11,11,.55); }
  .pir-dot-up   { background: #00e05a; }
  .pir-dot-down { background: #ff4d4d; }
  .pir-v.pir-flat { color: var(--text-muted); font-weight: 500; }
  /* META BATIDA = número em AMARELO VIVO (pedido do Luis 14/08). O problema é que amarelo não fecha
     contraste sobre nenhum passo claro da rampa branco→verde — nem com halo, que sobre fundo claro vira
     uma sujeira cinza em volta da letra. Solução: um SCRIM escuro por cima do passo (o `inset` gigante
     preenche a célula inteira com preto a 74%), então o amarelo passa a viver sobre fundo escuro em
     TODOS os passos (contraste ~10:1) e o matiz da escala ainda aparece por baixo — dá pra ver ao mesmo
     tempo que bateu a meta e onde a célula está dentro da coluna.
     `!important` porque a tinta do passo vem por style inline (a especificidade não bastaria). */
  .pir-v.pir-meta {
    color: #ffc400 !important; font-weight: 800;
    box-shadow: inset 0 0 0 999px rgba(11,11,11,.74);
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }
  /* não fechado: a HACHURA é o canal primário, não o matiz — vermelho-vazado vs verde-preenchido é um
     par de risco pra daltonismo, então a distinção não pode depender só da cor. */
  .pir-v.pir-open { color: var(--pir-open); font-weight: 500; background: rgba(248,113,113,.05);
                    background-image: repeating-linear-gradient(45deg, transparent 0 3px, rgba(248,113,113,.20) 3px 4.5px); }
  /* célula fora do cálculo (toggle "só safras maduras"): não pode parecer valor nem parecer zero.
     Um ponto discreto mantém a linha do grid e deixa a escada ainda mais legível que a hachura. */
  .pir-v.pir-excl { color: var(--text-dim); font-weight: 400; }
  /* cabecalho clicavel (ordenacao). A coluna ATIVA acende a tinta e o fundo — a seta sozinha, num texto
     de 10px maiusculo, passa batido numa tabela de 16 colunas. */
  /* linha "Outros" (cauda agregada): le-se como BALDE, nao como uma campanha. Fundo levemente levantado
     + rotulo em italico; os VALORES ficam normais, porque eles sao tao reais quanto os das outras. */
  .pir-table tbody tr.pir-row-bucket { background: rgba(255,255,255,.035); }
  .pir-table tbody tr.pir-row-bucket td.ch-name { font-style: italic; }
  .pir-table thead th.pir-th-ord { cursor: pointer; user-select: none; }
  .pir-table thead th.pir-th-ord:hover { color: var(--text); }
  .pir-table thead th.pir-th-on { color: var(--accent-yellow); background: rgba(255,196,0,.07); }
  .pir-table tfoot .pir-alt td { font-weight: 500; color: var(--text-muted); font-size: 10.5px;
                                 border-top: 0; padding-top: 0; }
  .pir-table tfoot td.pir-suja { color: var(--pir-open); }   /* total que mistura safra imatura */
  .pir-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 11px;
                color: var(--text-muted); margin: 0 0 10px; }
  .pir-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .pir-ramp { display: inline-flex; gap: 2px; }
  .pir-ramp i { width: 13px; height: 13px; border-radius: 2px; display: block; }
  .pir-sw { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid var(--border); }
  .pir-sw-open { background: rgba(248,113,113,.05); border-color: var(--pir-open);
                 background-image: repeating-linear-gradient(45deg, transparent 0 2px, rgba(248,113,113,.45) 2px 3.5px); }
  /* mesma receita da célula: scrim escuro sobre um passo da rampa + número amarelo vivo */
  .pir-sw-meta { background: var(--pir5); border: 0; width: auto; height: auto; padding: 1px 5px;
                 border-radius: 3px; color: #ffc400; font-weight: 800; font-size: 10px;
                 font-variant-numeric: tabular-nums; font-style: normal;
                 box-shadow: inset 0 0 0 999px rgba(11,11,11,.74); }
  .pir-tgl { display: inline-flex; align-items: center; gap: 7px; font-size: 11px;
             color: var(--text-muted); cursor: pointer; user-select: none; }
  .pir-tgl input { width: 14px; height: 14px; accent-color: var(--pir4); cursor: pointer; margin: 0; }
  /* eixo de dimensao com o corte de maturidade DESLIGADO: o proprio toggle fica marcado em vermelho.
     A legenda ja avisa, mas o aviso tem que estar tambem no controle que causa o problema — e quem
     desliga, desliga aqui. */
  .pir-tgl.pir-tgl-warn { color: var(--pir-open); font-weight: 600; }
  /* linha de dimensao com amostra pequena (fora da escala de cor): o ROTULO esmaece.
     O valor continua cheio na celula — nada de corte silencioso —, mas o olho para de ler a linha como
     se ela tivesse o mesmo peso das outras. */
  .pir-table td.ch-name.pir-thin { color: var(--text-dim); font-style: italic; }

  /* Daily Cashflow — tabela de PnL (linhas do arquivo × MTD ou × dia).
     Densidade maior que a .ch-table padrão: são 24 linhas fixas e até 31 colunas de dia. */
  .cf-table th, .cf-table td { padding: 7px 12px; }
  .cf-table .cf-tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-dim); font-weight: 600; vertical-align: 1px;
  }
  .cf-table .cf-dim { color: var(--text-dim); }
  .cf-table .cf-neg { color: var(--negative); }
  .cf-table .cf-pos { color: var(--positive); }
  /* subtotal: fundo levemente destacado + rótulo forte; a cor do VALOR segue o sinal (cf-neg/cf-pos) */
  .cf-table tr.cf-strong td { background: var(--surface-2); font-weight: 700; color: var(--text); }
  .cf-table tr.cf-strong td:first-child { color: var(--text); }
  /* subtotal recolhível: o rótulo vira botão inline (herda fonte/cor, não muda a caixa da célula) */
  .cf-table .cf-toggle {
    background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
    font: inherit; color: inherit; text-align: left;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cf-table .cf-toggle:hover, .cf-table .cf-toggle:hover .cf-chev { color: var(--accent-orange); }
  .cf-table .cf-chev {
    display: inline-block; width: 9px; font-size: 9px; line-height: 1;
    color: var(--text-dim); transition: transform .12s ease;
  }
  .cf-table .cf-chev.is-on { transform: rotate(-90deg); }   /* recolhido = seta pra direita */
  /* quantas linhas estão escondidas atrás do subtotal */
  .cf-table .cf-count {
    font-size: 9px; font-weight: 600; color: var(--text-dim);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 5px; line-height: 14px;
  }
  /* linha de detalhe dentro de Investimento Total */
  .cf-table tr.cf-sub td { color: var(--text-muted); font-size: 11px; }
  .cf-table tr.cf-sub td:first-child { padding-left: 28px; }
  /* linha desligada (créditos / IRPJ) fica apagada — está em zero de propósito */
  .cf-table tr.cf-off td { color: var(--text-dim); }
  /* linha memo (Meta diferida): itálico e apagada — aparece pra não sumir da vista, mas NÃO entra em subtotal */
  .cf-table tr.cf-memo td { color: var(--text-dim); font-style: italic; font-size: 11px; }
  .cf-table tr.cf-memo td:first-child { padding-left: 28px; }
  .cf-table tr.cf-memo td.cf-neg, .cf-table tr.cf-memo td.cf-pos { color: var(--text-dim); }
  .cf-table .cf-total-col { border-left: 1px solid var(--border-strong); font-weight: 700; }
  /* visão Diária: 1ª coluna congelada (o rótulo tem que sobreviver ao scroll horizontal de 31 colunas).
     z-index acima do thead sticky (z:2) só no cruzamento, senão o header some por baixo do rótulo. */
  .cf-daily td:first-child, .cf-daily th:first-child {
    position: sticky; left: 0; z-index: 3;
    background: var(--surface); min-width: 220px;
  }
  .cf-daily thead th:first-child { z-index: 4; background: var(--surface-2); }
  .cf-daily tr.cf-strong td:first-child { background: var(--surface-2); }
  .cf-daily th, .cf-daily td { font-size: 11px; }
  /* Supporting section */
  .support {
    margin-top: 8px;
  }
  /* Ativação D0: funil + distribuição lado a lado; empilha no mobile */
  .ativ-two-col {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 20px; margin-top: 8px;
  }
  @media (max-width: 720px) { .ativ-two-col { grid-template-columns: 1fr; } }
  .support-title {
    font-size: 12px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 14px;
  }
  .ch-note {
    margin-top: 12px; font-size: 11px; line-height: 1.6;
    color: var(--text-dim); max-width: 880px;
  }
  .ch-note strong { color: var(--text-muted); font-weight: 600; }
  /* FTD bridge (waterfall BP → Realizado) */
  .bridge-head { display: flex; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .bridge-head .b-act { font-size: 22px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
  .bridge-head .b-bp { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bridge-head .b-delta { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bridge-head .b-delta.verde { color: var(--positive); }
  .bridge-head .b-delta.amarelo { color: var(--warning); }
  .bridge-head .b-delta.vermelho { color: var(--negative); }
  .bridge-head .b-delta.cinza { color: var(--text-muted); }
  .bridge-head .b-extra { font-size: 11px; color: var(--text-dim); }
  .bridge-toggle { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; align-self: center; }
  .bridge-toggle button { background: transparent; border: none; color: var(--text-muted); font-family: inherit; font-size: 11px; padding: 4px 11px; cursor: pointer; }
  .bridge-toggle button:hover { color: var(--text); }
  .bridge-toggle button.active { background: var(--accent-yellow); color: #000; font-weight: 600; }
  .bridge-svg { display: block; }
  .bridge-svg text { font-variant-numeric: tabular-nums; }
  /* Composition bars */
  .hbar-list { display: flex; flex-direction: column; gap: 12px; }
  .hbar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
  }
  .hbar-head {
    display: flex; justify-content: space-between;
    align-items: baseline; margin-bottom: 10px;
  }
  .hbar-label { font-size: 13px; color: var(--text); font-weight: 500; }
  .hbar-value {
    font-size: 13px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hbar-value .secondary {
    color: var(--text-muted); margin-left: 8px; font-weight: 400;
  }
  .hbar-track {
    height: 8px; background: var(--surface-2);
    border-radius: 4px; overflow: hidden;
  }
  .hbar-fill {
    height: 100%; border-radius: 4px;
    background: var(--accent);
    transition: width .3s ease;
  }
  /* Footer */
  .footer {
    margin-top: 48px; padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--text-dim); font-size: 11px;
    text-align: center;
  }
  .farol-key {
    display: inline-flex; align-items: center; gap: 5px;
    margin-right: 14px; font-size: 11px; color: var(--text-muted);
  }
  .farol-key .dot { width: 7px; height: 7px; border-radius: 50%; }
  .farol-key .dot.verde { background: var(--positive); }
  .farol-key .dot.amarelo { background: var(--warning); }
  .farol-key .dot.vermelho { background: var(--negative); }
  @media (max-width: 900px) {
    .hero-grid { grid-template-columns: 1fr; }
    main { padding: 28px 18px 48px; }
    /* Once the top bars wrap, their heights no longer match the hard-coded
       sticky offsets (65px / 126px) and they overlap. Let topbar + slicer
       scroll away and pin only the tab bar. */
    .topbar { position: static; padding: 12px 18px; }
    /* :not(.slicer-ruler) — a régua de aba usa as DUAS classes; sem isso ela deixaria de congelar aqui. */
    .slicer:not(.slicer-ruler) { position: static; top: auto; }
    .tabs { position: sticky; top: 0; padding: 0 18px; }
    /* abas agora fixam no topo:0 → régua encosta logo abaixo delas */
    .slicer-ruler { top: 45px; margin: 0 -18px 22px; padding: 12px 18px; }
    .hero .value { font-size: 32px; }
  }
  @media (max-width: 600px) {
    html, body { font-size: 12.5px; }
    .topbar { padding: 11px 16px; gap: 8px; }
    .brand { font-size: 17px; }
    .controls { gap: 6px; }
    .slicer { padding: 12px 16px; gap: 10px; }
    .tabs { padding: 0 12px; }
    .slicer-ruler { top: 42px; margin: 0 -16px 18px; padding: 10px 16px; }
    .tab-btn { padding: 13px 14px; }
    main { padding: 22px 16px 44px; }
    .tab-header { margin-bottom: 22px; }
    .tab-header h1 { font-size: 21px; }
    .hero { padding: 18px; }
    .hero .value { font-size: 30px; }
    /* Stack each filter group onto its own full-width row */
    .slicer-group { flex: 1 1 100%; flex-wrap: wrap; }
    .slicer-group select,
    .slicer-group input[type="date"] { flex: 1 1 130px; min-width: 0; max-width: none; }
    .slicer-divider { display: none; }
    .slicer-presets { flex-wrap: wrap; }
    .apply-btn { flex: 1 1 100%; }
    .ch-table th, .ch-table td { padding: 9px 11px; font-size: 11.5px; }
    .ch-table thead th { font-size: 9.5px; }
  }
</style>

// WARM-UP DAS ABAS — pré-carga depois da 1ª carga oficial
